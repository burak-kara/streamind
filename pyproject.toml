[project]
name = "streamind"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "juturna",
    "faster-whisper",
    "httpx",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "aiortc",
]
cuda = [
    "vllm>=0.8.3",
    "huggingface-hub[cli]",
]
finetune = [
    "torch",
    "transformers>=4.45",
    "peft>=0.13",
    "trl>=0.12",
    "accelerate>=1.0",
    "bitsandbytes>=0.44",
    "datasets>=3.0",
    "sentencepiece",
    "protobuf",
]

[tool.setuptools]
packages = []

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", extra = "finetune" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
