[project]
name = "streamind"
version = "0.1.0"
requires-python = ">=3.12"
# Submission runtime: vLLM in-process + Janus audio stack + ASR + HTTP.
# Model weights are baked into the submission Docker image at build time.
dependencies = [
    "juturna",
    "faster-whisper",
    "httpx",
    "numpy",
    "vllm>=0.8.3",
]

[project.optional-dependencies]
# Everything dev-only: unit tests, audio injection, model fetching,
# and the finetune toolchain. Submission image runs
# `uv sync` with no extras.
dev = [
    "pytest",
    "pytest-asyncio",
    "aiortc",
    "huggingface-hub",
    "torch",
    "transformers>=4.45",
    "peft>=0.13",
    "trl>=0.12",
    "accelerate>=1.0",
    "bitsandbytes>=0.44",
    "datasets>=3.0",
    "sentencepiece",
    "protobuf",
]

[tool.setuptools]
packages = []

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
