[project]
name = "streamind"
version = "0.1.0"
requires-python = ">=3.12"
# Submission runtime: vLLM in-process + Janus audio stack + ASR + HTTP.
# Model weights are baked into the submission Docker image at build time via
# huggingface-hub (kept in base deps — pure-Python, no torch — so the lean
# `uv sync --no-install-project` build venv can fetch weights without --extra dev).
dependencies = [
    "juturna",
    "faster-whisper",
    "httpx",
    "numpy",
    "vllm",
    "nvidia-cublas-cu12",
    "huggingface-hub",
]

[project.optional-dependencies]
# Everything dev-only: unit tests, audio injection, and the finetune toolchain.
# Submission image runs `uv sync` with no extras.
dev = [
    "pytest",
    "pytest-asyncio",
    "aiortc",
    "torch",
    "transformers",
    "peft>=0.13",
    "trl>=0.12",
    "accelerate>=1.0",
    "bitsandbytes>=0.44",
    "datasets>=3.0",
    "sentencepiece",
    "jiwer",
]

[tool.setuptools]
packages = []
