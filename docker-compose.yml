services:
  janus:
    build: ./docker/janus
    ports:
      - "8088:8088"
      - "10000-10050:10000-10050/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - janus
    environment:
      SUMMARIZER_PROFILE: vllm-qwen3.5-4b
      WINDOW_SECONDS: "300"
    ports:
      - "8888:8888/udp"
    volumes:
      - ./results:/app/results
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
