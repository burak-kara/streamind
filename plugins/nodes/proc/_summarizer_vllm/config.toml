# Node defaults — overridden by pipeline JSON "configuration" at runtime.
# `model_name` MUST be a local filesystem path (./models/<name>); the node
# refuses to start if the directory is missing.
[arguments]
model_name = "./models/qwen3.5-4b"
prompt_template_file = "summarize_prompt.txt"
dtype = "float16"
gpu_memory_utilization = 0.85
max_model_len = 2048
max_tokens = 256
temperature = 0.3
top_p = 0.9
repetition_penalty = 1.05
enforce_eager = false
# Skip the LLM call entirely when the transcript is shorter than this many
# non-whitespace characters; emit SHORT_TRANSCRIPT_SENTINEL instead. Tuned to
# the rev16 30s smoke (window_34 was 54 chars, an end-of-stream fragment).
min_transcript_chars = 80
